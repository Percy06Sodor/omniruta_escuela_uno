<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniRuta Escolar - Gestión de Alumnos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">

  <header class="top-bar d-flex align-items-center justify-content-between px-4 bg-dark text-white">
    <div class="d-flex align-items-center gap-3">
      <span class="fw-bold fs-4 text-danger">OMNIRUTA ESCOLAR</span>
      <span class="badge bg-primary">Gestión Institucional</span>
    </div>
    <div class="d-flex align-items-center gap-2">
      <span id="userNombre" class="fw-medium">Cargando...</span>
      <button id="btnCerrarSesion" class="btn btn-sm btn-outline-light ms-3">Cerrar Sesión</button>
    </div>
  </header>

  <div class="d-flex main-layout">
    <aside class="sidebar p-3 bg-white border-end" style="width: 260px; min-height: 100vh;">
      <ul class="nav nav-pills flex-column gap-2">
        <li class="nav-item"><a href="dashboard_escuela.html" class="nav-link text-dark">Monitoreo Flota</a></li>
        <li class="nav-item"><a href="gestion_alumnos.html" class="nav-link active">Gestión Alumnos</a></li>
        <li class="nav-item"><a href="rutas_combis.html" class="nav-link text-dark">Rutas & Combis</a></li>
        <li class="nav-item"><a href="solicitar_excursion.html" class="nav-link text-dark">Solicitar Excursión</a></li>
      </ul>
    </aside>

    <main class="flex-grow-1 p-4">
      <div class="row g-4">
        
        <div class="col-lg-4">
          <div class="card border-0 shadow-sm p-4 rounded-4 bg-white">
            <h5 class="fw-bold mb-3">Registrar Nuevo Alumno</h5>
            <form id="formAlumno">
              <div class="mb-3">
                <label class="form-label small fw-semibold">Nombre Completo del Alumno</label>
                <input type="text" id="nombreAlumno" class="form-control" required placeholder="Ej: Lucas Pérez">
              </div>

              <div class="mb-3">
                <label class="form-label small fw-semibold">Nivel / Grado Escolar</label>
                <select id="nivelEscolar" class="form-select" required>
                  <option value="" disabled selected>Seleccione nivel</option>
                  <option value="Jardín / Inicial">Jardín / Inicial</option>
                  <option value="Primaria (1° a 3°)">Primaria (1° a 3°)</option>
                  <option value="Primaria (4° a 7°)">Primaria (4° a 7°)</option>
                </select>
              </div>

              <div class="mb-3">
                <label class="form-label small fw-semibold">Plan Escolar Contratado</label>
                <select id="planSuscrito" class="form-select" required>
                  <option value="BASICO">Plan Básico (Puerta a Puerta)</option>
                  <option value="MEDIO">Plan Medio (GPS en vivo + QR)</option>
                  <option value="PREMIUM">Plan Premium (Clubes + Asiento Fijo)</option>
                </select>
              </div>

              <div class="mb-3">
                <label class="form-label small fw-semibold">Domicilio de Recogida</label>
                <input type="text" id="direccionAlumno" class="form-control" required placeholder="Ej: Av. Cabildo 2400, CABA">
              </div>

              <div class="mb-3">
                <label class="form-label small fw-semibold">Email del Tutor Autorizado</label>
                <input type="email" id="emailTutor" class="form-control" required placeholder="padre@gmail.com">
              </div>

              <button type="submit" id="btnGuardarAlumno" class="btn btn-primary w-100 py-2 fw-semibold">
                Guardar Alumno
              </button>
            </form>
          </div>
        </div>

        <div class="col-lg-8">
          <div class="card border-0 shadow-sm p-4 rounded-4 bg-white">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h5 class="fw-bold m-0">Padrón de Alumnos Registrados</h5>
              <span class="badge bg-info text-dark" id="contadorAlumnos">Total: 0</span>
            </div>

            <div class="table-responsive">
              <table class="table align-middle">
                <thead>
                  <tr class="text-secondary small">
                    <th>Alumno</th>
                    <th>Nivel</th>
                    <th>Plan</th>
                    <th>Domicilio</th>
                    <th>Tutor (Email)</th>
                  </tr>
                </thead>
                <tbody id="tablaAlumnos">
                  <tr>
                    <td colspan="5" class="text-center py-4 text-muted">Cargando padrón de alumnos...</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script type="module" src="../js/gestion_alumnos.js"></script>
</body>
</html>
