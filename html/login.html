<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniRuta Escolar - Acceso Institucional</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">

  <div class="container" style="max-width: 420px;">
    <div class="card border-0 shadow-lg p-4 rounded-4 style-auth-card">
      <div class="text-center mb-4">
        <h3 class="fw-bold text-danger m-0">OMNIRUTA ESCOLAR</h3>
        <p class="text-muted small">Panel de Administración para Escuelas</p>
      </div>

      <form id="formLoginWeb">
        <div class="mb-3">
          <label class="form-label small fw-semibold">Correo Electrónico del Colegio</label>
          <input type="email" id="emailLogin" class="form-control" placeholder="admin@colegio.edu.ar" required>
        </div>

        <div class="mb-4">
          <label class="form-label small fw-semibold">Contraseña</label>
          <input type="password" id="passwordLogin" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" id="btnLogin" class="btn btn-danger w-100 py-2 fw-semibold">
          Iniciar Sesión
        </button>
      </form>

      <div class="text-center mt-4">
        <span class="small text-muted">¿Tu colegio aún no tiene cuenta?</span>
        <a href="registro.html" class="text-decoration-none small text-danger fw-bold ms-1">Registrar Escuela</a>
        <div class="mt-2">
          <a href="../index.html" class="text-decoration-none small text-secondary">← Volver al inicio</a>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="../js/login.js"></script>
</body>
</html>
